name: Build Cornet Downloads

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Generate application icons
        run: bunx tauri icon src-tauri/icons/icon.svg

      - name: Build Windows packages
        run: bun run tauri build --bundles nsis,msi

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: cornet-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: bun install

      - name: Generate application icons
        run: bunx tauri icon src-tauri/icons/icon.svg

      - name: Build Linux packages
        run: bun run tauri build --bundles appimage,deb

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: cornet-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: bun install

      - name: Initialize Tauri Android project
        run: bunx tauri android init --ci

      - name: Generate application icons
        run: bunx tauri icon src-tauri/icons/icon.svg

      - name: Build Android APK
        run: bunx tauri android build --apk

      - name: Sign Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required Android signing secret $secret_name is not configured."
              exit 1
            fi
          done

          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-unsigned.apk' | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::No unsigned Android APK was produced"
            find src-tauri/gen/android/app/build/outputs/apk -type f -print || true
            exit 1
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          KEYSTORE="$RUNNER_TEMP/cornet-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          mkdir -p release-assets/android
          ALIGNED_APK="$RUNNER_TEMP/cornet-aligned.apk"
          SIGNED_APK="release-assets/android/Cornet-Android.apk"

          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK"
          echo "Android APK signed successfully: $SIGNED_APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cornet-android
          path: release-assets/android/Cornet-Android.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: cornet-windows
          path: release-assets/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: cornet-linux
          path: release-assets/linux

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: cornet-android
          path: release-assets/android

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/windows/*.exe
            release-assets/windows/*.msi
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
            release-assets/android/*.apk
